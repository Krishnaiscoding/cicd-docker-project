name: Docker CI

on:
    push:
        branches:
            - main

jobs:
    test-and-build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Verify HTML exists
              run : ls -l index.html

            - name: Build Docker Image
                run: docker build -t cicd-demo .
            - name: Run Docker Container
                run: docker run -d -p 8080:80 --name cicd-container cicd-demo
            - name: Test Website
              run: |
                sleep 5
                curl -I http://localhost:8080 | grep "200 OK"
            - name: Stop Docker Container
                run: docker stop cicd-container
            
